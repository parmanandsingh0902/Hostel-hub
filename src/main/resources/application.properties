# Server configuration
server.port=8080

# MySQL Datasource configuration with environment variable fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostelhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:hostelhub_user}
spring.datasource.password=${DB_PASSWORD:hostelhub_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
